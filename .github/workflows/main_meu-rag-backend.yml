name: Build and deploy Python app to Azure Web App - meu-rag-backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies into antenv
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create deployment zip
        run: |
          zip -r deploy.zip . \
            --exclude "*.git*" \
            --exclude "__pycache__/*" \
            --exclude ".claude/*"

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: deploy-zip
          path: deploy.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: deploy-zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_6B29492E45E3474A86CA3E3C6C444EC0 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_4E782FF2A2D74A6CA35EC8E2615FF019 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4154067A8F894DBE8359F9D2AD387495 }}

      - name: Stop app before deploy
        run: az webapp stop --name meu-rag-backend --resource-group grupo-rag-ia

      - name: Deploy via SCM zip (bypasses OneDeploy 409)
        run: |
          az webapp deployment source config-zip \
            --name meu-rag-backend \
            --resource-group grupo-rag-ia \
            --src deploy.zip

      - name: Set startup command and start app
        run: |
          az webapp config set \
            --name meu-rag-backend \
            --resource-group grupo-rag-ia \
            --startup-file 'gunicorn --bind=0.0.0.0 --timeout=600 --workers=1 app:app'
          az webapp start --name meu-rag-backend --resource-group grupo-rag-ia
